<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes alertes Leboncoin</title>
<style>
:root{--bg:#0b0807;--panel:#15100d;--panel2:#1c1511;--ink:#f6ebe1;--ink2:#cdb9a8;--ink3:#97806e;--acc:#ff8a3d;--acc2:#ffa766;--on-acc:#1a0b02;--line:rgba(255,138,61,.16);--line2:rgba(255,138,61,.4);--chip:rgba(255,138,61,.1);--ok:#5fd27a;--bad:#ff7a6b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:14px 24px;background:rgba(11,8,7,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.01em;flex:1}
header h1 span{color:var(--acc)}
.status{font-size:13px;color:var(--ink3)}
.status.dirty{color:var(--acc2)}
.status.ok{color:var(--ok)}
.btn{appearance:none;border:1px solid var(--line2);background:transparent;border-radius:8px;min-height:40px;padding:0 16px;cursor:pointer;font-weight:550;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--chip);border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover:not(:disabled){background:var(--acc2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);background:rgba(255,122,107,.08)}
.btn.small{min-height:32px;padding:0 12px;font-size:13px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;max-width:1100px;margin:0 auto;padding:24px}
nav{display:flex;flex-direction:column;gap:8px;position:sticky;top:88px;align-self:start}
.navlabel{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin:4px 4px 2px}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--line2)}
.item[aria-current="true"]{border-color:var(--acc);background:var(--panel2)}
.item b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;color:var(--ink3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{border-style:dashed;color:var(--ink2);text-align:center}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:650}
.card .sub{margin:0 0 18px;color:var(--ink3);font-size:13.5px}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field>label,.lbl{display:block;font-weight:550;margin-bottom:6px;font-size:14px}
.help{color:var(--ink3);font-size:12.5px;margin:6px 0 0}
input[type=text],input[type=number],input[type=password],input[type=url],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;min-height:40px}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:120px}
.price{display:flex;align-items:center;gap:10px}
.price input{max-width:140px}
.price span{color:var(--ink3)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.pill:hover{border-color:var(--acc);color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:550}
.switch,.field>label.switch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:36px;margin:0;font-weight:500}
.switch input{appearance:none;width:40px;height:22px;border-radius:999px;background:#3a2c23;position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#f6ebe1;transition:left .15s}
.switch input:checked{background:var(--acc)}
.switch input:checked::after{left:21px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px;min-height:40px;cursor:text}
.tags:focus-within{border-color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 9px;font-size:13.5px}
.tag button{border:0;background:transparent;color:var(--ink3);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.tag button:hover{color:var(--bad)}
.tags input{border:0;background:transparent;flex:1;min-width:120px;padding:4px;outline:none}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.suggest button{border:1px dashed var(--line2);background:transparent;border-radius:6px;padding:2px 9px;font-size:12.5px;color:var(--ink3);cursor:pointer}
.suggest button:hover{color:var(--ink);border-color:var(--acc)}
details.adv{border-top:1px solid var(--line);margin-top:6px;padding-top:14px}
details.adv>summary{cursor:pointer;color:var(--ink2);font-weight:550;list-style:none;display:flex;align-items:center;gap:8px}
details.adv>summary::before{content:"›";display:inline-block;transition:transform .15s;color:var(--acc);font-size:18px}
details.adv[open]>summary::before{transform:rotate(90deg)}
details.adv .inner{padding-top:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,52px));gap:6px;margin-top:14px}.cal .pill{padding:6px 0;text-align:center}
.sched-list{display:grid;gap:8px}
.chart{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pill.small{padding:3px 10px;font-size:12.5px}
.pchart-wrap{position:relative;margin-top:8px}
.pchart{width:100%;height:auto;display:block;overflow:visible}
.pchart .grid{stroke:var(--line);stroke-width:1}
.pchart .ax{fill:var(--ink3);font-size:11px}
.pchart .cross{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 3}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw-line{display:inline-block;width:16px;height:2px;border-radius:2px}
.sw-band{display:inline-block;width:14px;height:10px;opacity:.3;border-radius:2px}
.sw-dash{display:inline-block;width:16px;height:0;border-top:2px dashed}
.tip{position:absolute;top:28px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12.5px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.tip .muted{color:var(--ink3)}
.test-big{font-size:15px;margin:14px 0 8px}
.test-big b{font-size:22px;color:var(--acc)}
.examples{margin:0 0 10px;padding-left:18px;font-size:13.5px}
.examples a{color:var(--ink)}
.examples span{color:var(--ink3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px;z-index:50}
.modal{max-width:560px;width:100%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{margin:0 0 10px}
.modal .close{position:absolute;top:10px;right:10px;font-size:20px}
.modal-head{margin-bottom:10px;font-size:14px}
.modal-head a{color:var(--ink)}
.modal-head span{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.footer-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.secret{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(95,210,122,.12);color:var(--ok)}
.badge.off{background:rgba(255,122,107,.1);color:var(--bad)}
.channel{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.channel .body{padding-top:14px}
.msg{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.msg.err{background:rgba(255,122,107,.1);border:1px solid rgba(255,122,107,.4);color:#ffc2ba}
.msg.okm{background:rgba(95,210,122,.08);border:1px solid rgba(95,210,122,.35);color:#c9f2d2}
pre.toml{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;max-height:420px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink2);margin:12px 0 0}
.empty{color:var(--ink3);text-align:center;padding:40px 0}
@media (max-width:760px){.layout{grid-template-columns:1fr;padding:16px}nav{position:static}.grid2{grid-template-columns:1fr}header{padding:12px 16px;gap:10px}header h1{font-size:16px}.status{font-size:12px;max-width:110px;line-height:1.25}}
</style>
</head>
<body>
<header>
  <h1>Mes alertes <span>Leboncoin</span></h1>
  <span id="status" class="status" role="status" aria-live="polite">Chargement…</span>
  <button id="saveBtn" class="btn primary" type="button" disabled>Enregistrer</button>
</header>
<div class="layout">
  <nav aria-label="Alertes">
    <div class="navlabel">Alertes</div>
    <div id="list"></div>
    <button id="addBtn" class="item add" type="button">+ Nouvelle alerte</button>
    <div class="navlabel" style="margin-top:14px">Réglages</div>
    <button id="settingsBtn" class="item" type="button"><b>Notifications et fréquence</b><small id="settingsSum"></small></button>
  </nav>
  <main>
    <div id="msg"></div>
    <div id="view"></div>
    <details class="card" id="tomlBox">
      <summary style="cursor:pointer;color:var(--ink3);font-size:13.5px">Voir le fichier de configuration généré</summary>
      <pre class="toml" id="toml">…</pre>
    </details>
  </main>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
};

const S = { cfg: null, secrets: {}, updates: {}, version: null, sel: 0, view: 'search', dirty: false, saving: false };

// ── helpers données ──────────────────────────────────────────────
const searches = () => (S.cfg.search ||= []);
const notify = () => (S.cfg.notify ||= {});
const general = () => (S.cfg.general ||= {});
function setKey(obj, key, val) {
  const empty = val == null || val === '' || val === false || (Array.isArray(val) && !val.length) || (typeof val === 'number' && isNaN(val));
  if (empty) delete obj[key]; else obj[key] = val;
  touch();
}
function touch() { S.dirty = true; renderStatus(); renderList(); schedulePreview(); }
const num = (v) => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };
function slug(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40); }
function summary(s) {
  const p = [];
  if (s.min_price != null && s.max_price != null) p.push(`${s.min_price}–${s.max_price} €`);
  else if (s.max_price != null) p.push(`≤ ${s.max_price} €`);
  else if (s.min_price != null) p.push(`≥ ${s.min_price} €`);
  try { const u = new URL(s.url); const t = u.searchParams.get('text'); if (t) p.push(t); const l = u.searchParams.get('locations'); if (l) p.push(l.split('_')[0]); } catch {}
  const when = scheduleText(s.schedule);
  if (when) p.unshift(when);
  return p.join(' · ') || 'Aucun filtre';
}
const DAYS = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const DAY_LABELS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const fmtDur = (m) => { if (m >= 10080 && m % 10080 === 0) return `${m / 10080} semaine${m > 10080 ? 's' : ''}`; if (m >= 1440 && m % 1440 === 0) return `${m / 1440} jour${m > 1440 ? 's' : ''}`; const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} h ${String(r).padStart(2, '0')}` : `${h} h`) : `${r} min`; };
function scheduleText(sc) {
  if (!sc) return '';
  if (sc.every_minutes) return `toutes les ${fmtDur(sc.every_minutes)}`;
  const at = (sc.at || []).join(', ');
  if (sc.weekdays?.length) return `${sc.weekdays.map((d) => d.slice(0, 3)).join(', ')} à ${at}`;
  if (sc.month_days?.length) return `le ${sc.month_days.join(', ')} du mois à ${at}`;
  return `chaque jour à ${at}`;
}

// ── composants ───────────────────────────────────────────────────
function field(label, control, help) {
  return h('div', { class: 'field' }, h('label', { text: label }), control, help ? h('p', { class: 'help', text: help }) : null);
}
function text(obj, key, attrs = {}) {
  return h('input', { type: 'text', value: obj[key] ?? '', ...attrs, oninput: (e) => setKey(obj, key, e.target.value.trim()) });
}
function number(obj, key, attrs = {}) {
  return h('input', { type: 'number', min: 0, inputmode: 'numeric', value: obj[key] ?? '', ...attrs, oninput: (e) => setKey(obj, key, num(e.target.value)) });
}
function pills(obj, key, options, { multi = false } = {}) {
  const box = h('div', { class: 'pills', role: 'group' });
  const draw = () => {
    box.textContent = '';
    for (const [val, lab] of options) {
      const cur = obj[key];
      const on = multi ? (cur || []).includes(val) : (cur ?? null) === val;
      box.append(h('button', { type: 'button', class: 'pill', 'aria-pressed': String(on), text: lab, onclick: () => {
        if (multi) { const set = new Set(cur || []); on ? set.delete(val) : set.add(val); setKey(obj, key, [...set]); }
        else setKey(obj, key, val);
        draw();
      } }));
    }
  };
  draw();
  return box;
}
function toggle(obj, key, label) {
  return h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: !!obj[key], onchange: (e) => setKey(obj, key, e.target.checked) }), h('span', { text: label }));
}
function tags(obj, key, { placeholder = 'Écris puis Entrée', suggestions = [], lower = true } = {}) {
  const wrap = h('div');
  const box = h('div', { class: 'tags' });
  const input = h('input', { type: 'text', placeholder });
  const sug = h('div', { class: 'suggest' });
  const list = () => obj[key] || [];
  const add = (v) => { v = v.trim(); if (lower) v = v.toLowerCase(); if (!v || list().includes(v)) return; setKey(obj, key, [...list(), v]); draw(); };
  const draw = () => {
    box.textContent = '';
    for (const t of list()) box.append(h('span', { class: 'tag' }, t, h('button', { type: 'button', 'aria-label': `Retirer ${t}`, text: '×', onclick: () => { setKey(obj, key, list().filter((x) => x !== t)); draw(); } })));
    box.append(input);
    sug.textContent = '';
    for (const s of suggestions.filter((x) => !list().includes(x))) sug.append(h('button', { type: 'button', text: `+ ${s}`, onclick: () => add(s) }));
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(input.value); input.value = ''; input.focus(); }
    else if (e.key === 'Backspace' && !input.value && list().length) { setKey(obj, key, list().slice(0, -1)); draw(); input.focus(); }
  });
  input.addEventListener('blur', () => { if (input.value.trim()) { add(input.value); input.value = ''; } });
  box.addEventListener('click', () => input.focus());
  draw();
  wrap.append(box, suggestions.length ? sug : '');
  return wrap;
}
function lines(obj, key, placeholder) {
  return h('textarea', { placeholder, rows: 2, spellcheck: 'false', oninput: (e) => setKey(obj, key, e.target.value.split('\n').map((x) => x.trim()).filter(Boolean)) }, (obj[key] || []).join('\n'));
}
function card(title, sub, ...kids) { return h('section', { class: 'card' }, h('h2', { text: title }), sub ? h('p', { class: 'sub', text: sub }) : null, ...kids); }

// ── vues ─────────────────────────────────────────────────────────
function renderList() {
  const box = $('list'); box.textContent = '';
  searches().forEach((s, i) => box.append(h('button', { type: 'button', class: 'item', 'aria-current': String(S.view === 'search' && S.sel === i), onclick: () => { S.view = 'search'; S.sel = i; render(); } },
    h('b', { text: s.name || 'Sans nom' }), h('small', { text: summary(s) }))));
  $('settingsBtn').setAttribute('aria-current', String(S.view === 'settings'));
  const on = ['discord', 'telegram', 'email', 'webhook'].filter((c) => notify()[c]?.enabled).map(cap);
  $('settingsSum').textContent = `${on.join(', ') || 'Aucun canal'} · toutes les ${general().interval_minutes ?? 15} min`;
}
const cap = (s) => s[0].toUpperCase() + s.slice(1);

function viewSearch() {
  const list = searches();
  if (!list.length) return h('div', { class: 'card empty' }, h('p', { text: 'Aucune alerte pour le moment.' }), h('button', { class: 'btn primary', type: 'button', text: '+ Créer ma première alerte', onclick: addSearch }));
  const s = list[Math.min(S.sel, list.length - 1)];
  const urlInput = h('textarea', { rows: 2, spellcheck: 'false', placeholder: 'https://www.leboncoin.fr/recherche?…', oninput: (e) => { setKey(s, 'url', e.target.value.trim()); openLink.href = s.url || '#'; } }, s.url || '');
  const openLink = h('a', { class: 'btn small', href: s.url || '#', target: '_blank', rel: 'noopener noreferrer', text: 'Ouvrir sur Leboncoin ↗', style: 'display:inline-flex;align-items:center;text-decoration:none' });
  const quick = h('input', { type: 'text', placeholder: 'ex. vélo électrique, canapé, ps5' });
  const gen = () => {
    const t = quick.value.trim(); if (!t) return;
    s.url = `https://www.leboncoin.fr/recherche?text=${encodeURIComponent(t)}`;
    urlInput.value = s.url; openLink.href = s.url;
    if (!s.name || s.name.startsWith('nouvelle-alerte')) { s.name = slug(t); nameInput.value = s.name; }
    touch();
  };
  quick.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); gen(); } });
  const nameInput = text(s, 'name', { placeholder: 'ex. velo-nantes' });

  return h('div', {},
    card('Ce que je surveille', 'Le plus simple : fais ta recherche sur leboncoin.fr avec les filtres voulus (catégorie, ville, prix…), puis colle l’adresse de la page ici.',
      field('Nom de l’alerte', nameInput, 'Il apparaît dans les notifications.'),
      field('Lien de la recherche Leboncoin', h('div', {}, urlInput, h('div', { class: 'row', style: 'margin-top:8px' }, openLink))),
      h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Pas de lien ? Écris simplement ce que tu cherches' }),
        h('div', { class: 'row' }, quick, h('button', { class: 'btn', type: 'button', text: 'Créer le lien', onclick: gen, style: 'flex:0 0 auto' })),
        h('p', { class: 'help', text: 'Recherche dans toute la France. Pour une ville précise, passe plutôt par le site.' }))),
    card('Fréquence de cette alerte', 'À quel moment le bot vérifie cette recherche.', scheduleField(s)),
    card('Prix', null,
      h('div', { class: 'price' }, h('span', { text: 'Entre' }), number(s, 'min_price', { placeholder: 'min' }), h('span', { text: 'et' }), number(s, 'max_price', { placeholder: 'max' }), h('span', { text: '€' })),
      dropField(s),
      priceChart(s)),
    card('Mots-clés', 'Appliqués au titre de l’annonce.',
      field('Le titre doit contenir au moins un de ces mots', tags(s, 'keywords_include', { placeholder: 'ex. vélo, trek…' }), 'Laisse vide pour tout garder.'),
      field('Ignorer les annonces dont le titre contient', tags(s, 'keywords_exclude', { placeholder: 'ex. cassé…', suggestions: ['recherche', 'je cherche', 'échange', 'hs', 'pour pièces', 'cassé'] }))),
    card('Filtres', null,
      field('Villes', tags(s, 'cities_include', { placeholder: 'ex. nantes, rezé…' }), 'Garde seulement les annonces de ces villes. Vide = toutes.'),
      field('Publiée depuis', ageField(s)),
      field('Vendeur', pills(s, 'seller_type', [[null, 'Tous'], ['particulier', 'Particuliers'], ['pro', 'Professionnels']])),
      field('État', pills(s, 'condition_include', [['neuf', 'Neuf'], ['très bon état', 'Très bon état'], ['bon état', 'Bon état'], ['satisfaisant', 'Satisfaisant']], { multi: true }), 'Aucun choix = tous les états.'),
      h('div', { class: 'field' }, toggle(s, 'shippable_only', 'Uniquement les annonces avec livraison possible')),
      viewMore(s)),
    viewTech(s),
    testCard(s, list.indexOf(s)),
    h('div', { class: 'footer-actions' },

// Durée heures + minutes (roulettes natives des champs numériques).
function durationInput(get, set, { units = ['min', 'h', 'j', 'sem'] } = {}) {
  // « Toutes les [N] [minutes|heures|jours|semaines] » ; en heures, minutes en plus (14 h 37).
  const U = { min: [1, 'minutes'], h: [60, 'heures'], j: [1440, 'jours'], sem: [10080, 'semaines'] };
  const v = get();
  let unit = units.filter((u) => u !== 'min').reverse().find((u) => v % U[u][0] === 0) || (v >= 60 && units.includes('h') ? 'h' : 'min');
  const wrap = h('div', { class: 'price', style: 'flex-wrap:wrap' });
  const n = h('input', { type: 'number', min: 1, inputmode: 'numeric', style: 'max-width:90px', 'aria-label': 'nombre' });
  const sel = h('select', { style: 'max-width:150px', 'aria-label': 'unité' }, ...units.map((u) => h('option', { value: u, text: U[u][1] })));
  const extra = h('input', { type: 'number', min: 0, max: 59, inputmode: 'numeric', style: 'max-width:80px', 'aria-label': 'minutes en plus' });
  const extraBox = h('span', { class: 'price' }, h('span', { text: 'et' }), extra, h('span', { text: 'min' }));
  const fill = (val) => {
    n.value = unit === 'h' ? Math.floor(val / 60) : Math.max(1, Math.round(val / U[unit][0]));
    extra.value = unit === 'h' ? val % 60 : 0;
    sel.value = unit; extraBox.hidden = unit !== 'h';
  };
  const upd = () => {
    const t = (num(n.value) || 0) * U[unit][0] + (unit === 'h' ? Math.min(num(extra.value) || 0, 59) : 0);
    set(t > 0 ? t : null);
  };
  sel.addEventListener('change', () => { unit = sel.value; extra.value = 0; extraBox.hidden = unit !== 'h'; upd(); });
  n.addEventListener('input', upd); extra.addEventListener('input', upd);
  fill(v);
  wrap.append(n, sel, extraBox);
  return wrap;
}

// Planning par alerte → [search.schedule] (voir schedule.py côté bot).

    wrap.textContent = '';

function svgChart(weeks, retail) {
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  const W = 640, H = 220, L = 52, R = 14, T = 12, B = 30;
  const t = (iso) => new Date(iso + 'T00:00:00').getTime();
  const xs = weeks.map((w) => t(w.week));
  const x0 = Math.min(...xs), x1 = Math.max(...xs) + 7 * 864e5;
  const refPts = retail.filter((r) => t(r.date) >= x0 - 7 * 864e5 && t(r.date) <= x1 + 7 * 864e5);
  const vals = [...weeks.flatMap((w) => [w.p25 ?? w.median, w.p75 ?? w.median]), ...refPts.map((r) => r.price)];
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.12 || hi * 0.1 || 10; lo = Math.max(0, lo - pad); hi += pad;
  const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 4 || 1))); const tick = [1, 2, 2.5, 5, 10].map((k) => k * step).find((k) => (hi - lo) / k <= 5) || step * 10;
  lo = Math.floor(lo / tick) * tick; hi = Math.ceil(hi / tick) * tick;
  const X = (ms) => L + (W - L - R) * (x1 === x0 ? 0.5 : (ms - x0) / (x1 - x0));
  const mid = (w) => t(w.week) + 3.5 * 864e5;
  const Y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, class: 'pchart', role: 'img', 'aria-label': 'Évolution du prix médian par semaine' });
  for (let v = lo; v <= hi + 1e-9; v += tick) {
    svg.append(sv('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: 'grid' }));
    const tx = sv('text', { x: L - 8, y: Y(v) + 4, 'text-anchor': 'end', class: 'ax' }); tx.textContent = `${Math.round(v)} €`; svg.append(tx);
  }
  const every = Math.ceil(weeks.length / 6);
  weeks.forEach((w, i) => { if (i % every) return; const tx = sv('text', { x: X(mid(w)), y: H - 8, 'text-anchor': 'middle', class: 'ax' }); tx.textContent = new Date(w.week).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }); svg.append(tx); });
  if (weeks.length > 1) {
    const top = weeks.map((w) => `${X(mid(w))},${Y(w.p75)}`), bot = weeks.slice().reverse().map((w) => `${X(mid(w))},${Y(w.p25)}`);
    svg.append(sv('polygon', { points: [...top, ...bot].join(' '), fill: C_MED, 'fill-opacity': '0.16' }));
    svg.append(sv('polyline', { points: weeks.map((w) => `${X(mid(w))},${Y(w.median)}`).join(' '), fill: 'none', stroke: C_MED, 'stroke-width': 2, 'stroke-linejoin': 'round' }));
  } else {
    const w = weeks[0]; svg.append(sv('line', { x1: X(mid(w)), x2: X(mid(w)), y1: Y(w.p25), y2: Y(w.p75), stroke: C_MED, 'stroke-opacity': '0.4', 'stroke-width': 8, 'stroke-linecap': 'round' }));
  }
  if (refPts.length) {
    const pts = refPts.map((r) => `${X(Math.min(Math.max(t(r.date), x0), x1))},${Y(r.price)}`);
    if (pts.length === 1) pts.push(`${W - R},${Y(refPts[0].price)}`), pts.unshift(`${L},${Y(refPts[0].price)}`);
    svg.append(sv('polyline', { points: pts.join(' '), fill: 'none', stroke: C_REF, 'stroke-width': 2, 'stroke-dasharray': '6 4' }));
  }
  weeks.forEach((w) => svg.append(sv('circle', { cx: X(mid(w)), cy: Y(w.median), r: 4, fill: C_MED, stroke: 'var(--panel)', 'stroke-width': 2 })));
  // survol : crosshair + infobulle
  const cross = sv('line', { y1: T, y2: H - B, class: 'cross', visibility: 'hidden' }); svg.append(cross);
  const wrap = h('div', { class: 'pchart-wrap' });
  const tip = h('div', { class: 'tip', hidden: true });
  const lastRef = refPts.length ? refPts[refPts.length - 1].price : null;
  weeks.forEach((w, i) => {
    const xa = i ? (X(mid(weeks[i - 1])) + X(mid(w))) / 2 : L, xb = i < weeks.length - 1 ? (X(mid(w)) + X(mid(weeks[i + 1]))) / 2 : W - R;
    const hit = sv('rect', { x: xa, y: T, width: Math.max(1, xb - xa), height: H - T - B, fill: 'transparent' });
    hit.addEventListener('pointerenter', () => {
      cross.setAttribute('x1', X(mid(w))); cross.setAttribute('x2', X(mid(w))); cross.setAttribute('visibility', 'visible');
      tip.hidden = false; tip.textContent = '';
      tip.append(h('b', { text: `Semaine du ${new Date(w.week).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}` }),
        h('div', { text: `Médiane : ${w.median} €` }), h('div', { text: `Moitié des annonces entre ${w.p25} et ${w.p75} €` }),
        h('div', { class: 'muted', text: `${w.n} annonce${w.n > 1 ? 's' : ''}` }), lastRef ? h('div', { text: `Neuf (idealo) : ${lastRef} €` }) : null);
      const px = (X(mid(w)) / W) * 100; tip.style.left = `${Math.min(Math.max(px, 18), 82)}%`;
    });
    hit.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
    svg.append(hit);
  });
  const legend = h('div', { class: 'legend' },
    h('span', {}, h('i', { class: 'sw-line', style: `background:${C_MED}` }), 'Prix médian'),
    h('span', {}, h('i', { class: 'sw-band', style: `background:${C_MED}` }), 'Moitié centrale des annonces'),
    refPts.length ? h('span', {}, h('i', { class: 'sw-dash', style: `border-color:${C_REF}` }), 'Prix neuf (idealo)') : null);
  wrap.append(legend, svg, tip);
  return wrap;
}

    if (!e.target.checked && TECH_KEYS.some((k) => s[k] != null)) {
      if (!confirm('Retirer les critères informatiques de cette alerte ?')) { e.target.checked = true; return; }
      for (const k of TECH_KEYS) delete s[k];
      touch(); render(); return;
    }
    body.hidden = !e.target.checked;
  } });
  return h('section', { class: 'card' },
    h('label', { class: 'switch' }, sw, h('span', {}, h('b', { text: 'Critères pour le matériel informatique' }), h('span', { class: 'help', style: 'display:block;margin:0', text: 'RAM, carte graphique, stockage… Seulement si tu cherches un ordinateur ou des composants.' }))),
    body);
}

function secretField(ch, label) {
  const box = h('div', { class: 'secret' });
  const draw = (editing) => {
    box.textContent = '';
    if (editing) {
      const inp = h('input', { type: 'password', autocomplete: 'off', placeholder: `Nouveau ${label.toLowerCase()}`, value: S.updates[ch] || '', oninput: (e) => { S.updates[ch] = e.target.value; touch(); } });
      box.append(inp, h('button', { class: 'btn small ghost', type: 'button', text: 'Annuler', onclick: () => { delete S.updates[ch]; touch(); draw(false); } }));
      setTimeout(() => inp.focus());
    } else {
      box.append(h('span', { class: S.secrets[ch] ? 'badge' : 'badge off', text: S.secrets[ch] ? 'Configuré ✓' : 'Non configuré' }),
        h('button', { class: 'btn small', type: 'button', text: S.secrets[ch] ? 'Remplacer' : 'Renseigner', onclick: () => draw(true) }));
    }
  };
  draw(!!S.updates[ch]);
  return field(label, box, 'Stocké à part, dans le fichier .env. La valeur n’est jamais affichée.');
}

function channel(ch, title, body) {
  const n = notify(); const sec = n[ch] || {};
  const inner = h('div', { class: 'body', hidden: !sec.enabled || null }, ...body(sec));
  return h('div', { class: 'channel' },
    h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: !!sec.enabled, onchange: (e) => { sec.enabled = e.target.checked; n[ch] = sec; inner.hidden = !sec.enabled; touch(); } }), h('b', { text: title })),
    inner);
}

function viewSettings() {
  const g = general();
  return h('div', {},
    card('Notifications', 'Où recevoir les nouvelles annonces. Active au moins un canal.',
      channel('discord', 'Discord', () => [secretField('discord', 'Lien du webhook'),
        field('Adresse de cette interface, pour les liens dans Discord', text(general(), 'ui_url', { placeholder: 'http://localhost:3000' }), 'Si elle est renseignée, chaque notification a deux liens : « Pas intéressé » et « Écrire au vendeur ». Ils fonctionnent quand ton tunnel est ouvert.')]),
      channel('telegram', 'Telegram', (sec) => [secretField('telegram', 'Jeton du bot'), field('Identifiant de la conversation', text(sec, 'chat_id'))]),
      channel('email', 'E-mail', (sec) => [
        h('div', { class: 'grid2' }, field('Serveur SMTP', text(sec, 'smtp_host', { placeholder: 'smtp.gmail.com' })), field('Port', number(sec, 'smtp_port', { placeholder: '587' })),
          field('Identifiant', text(sec, 'username')), field('Expéditeur', text(sec, 'from'))),
        secretField('email', 'Mot de passe'),
        field('Destinataires', tags(sec, 'to', { placeholder: 'adresse puis Entrée', lower: false }))]),
      channel('webhook', 'Webhook (avancé)', () => [secretField('webhook', 'Adresse du webhook')])),
    card('Fréquence', null,
      field('Rythme par défaut : vérifier toutes les', durationInput(() => g.interval_minutes ?? 15, (v) => setKey(g, 'interval_minutes', v || 15), { units: ['min', 'h'] }), 'S’applique aux alertes réglées sur « À chaque passage ». Moins de 10 minutes augmente le risque de blocage par Leboncoin.'),
      field('Fréquence de chaque alerte', h('div', { class: 'sched-list' }, ...searches().map((x, i) => h('button', { type: 'button', class: 'item', onclick: () => { S.view = 'search'; S.sel = i; render(); window.scrollTo({ top: 0 }); } },
        h('b', { text: x.name || 'Sans nom' }), h('small', { text: (scheduleText(x.schedule) || `à chaque passage (${fmtDur(g.interval_minutes ?? 15)})`) + ' · modifier ›' })))), 'Pour une alerte hebdomadaire ou mensuelle, ouvre-la et choisis « Chaque semaine » ou « Chaque mois ».'),
      h('div', { class: 'field' }, toggle(g, 'hold_notifications', 'Valider moi-même chaque annonce avant l’envoi'),
        h('p', { class: 'help', text: 'Les annonces retenues attendent ta validation dans le rapport quotidien au lieu de partir directement.' }))));
}

function render() {
  renderList();
  const v = $('view'); v.textContent = '';
  v.append(S.view === 'settings' ? viewSettings() : viewSearch());
}
function addSearch() {
  const list = searches();
  let n = 1; while (list.some((s) => s.name === `nouvelle-alerte-${n}`)) n++;
  list.push({ name: `nouvelle-alerte-${n}`, url: '' });
  S.view = 'search'; S.sel = list.length - 1; touch(); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── statut, aperçu, sauvegarde ───────────────────────────────────
function renderStatus(kind, txt) {
  const st = $('status');
  st.className = 'status' + (kind ? ` ${kind}` : S.dirty ? ' dirty' : '');
  st.textContent = txt || (S.dirty ? 'Modifications non enregistrées' : 'À jour');
  $('saveBtn').disabled = !S.dirty || S.saving;
}
function showMsg(kind, txt) {
  const m = $('msg'); m.textContent = '';
  if (txt) m.append(h('div', { class: `msg ${kind}`, role: kind === 'err' ? 'alert' : 'status', text: txt }));
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-LBC-UI': '1' }, body: JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({ error: `Erreur ${r.status}` }));
  if (!r.ok) throw Object.assign(new Error(data.error || `Erreur ${r.status}`), { status: r.status });
  return data;
}
const payload = () => ({ config: S.cfg, secrets: S.updates, version: S.version });
let pvTimer = null;
function schedulePreview() { clearTimeout(pvTimer); pvTimer = setTimeout(preview, 400); }
async function preview() {
  try { $('toml').textContent = (await api('/api/preview', payload())).toml; if (S.dirty) showMsg(); }
  catch (e) { $('toml').textContent = `⚠ ${e.message}`; }
}
async function save() {
  S.saving = true; renderStatus(null, 'Enregistrement…');
  try {
    const r = await api('/api/save', payload());
    S.dirty = false; S.version = r.version;
    for (const [k, v] of Object.entries(S.updates)) if (v) S.secrets[k] = true;
    S.updates = {};
    showMsg('okm', 'Enregistré. Le changement sera pris en compte au prochain passage, sans redémarrage.');
    renderStatus('ok', 'Enregistré ✓');
    if (S.view === 'settings') render();
    return true;
  } catch (e) {
    showMsg('err', `Rien n’a été enregistré : ${e.message}`);
    renderStatus();
    return false;
  } finally { S.saving = false; $('saveBtn').disabled = !S.dirty; }
}
// ── actions depuis Discord : #avis/<alerte>/<id>, #vendeur/<alerte>/<id> ──
const STOP = new Set(['les', 'des', 'une', 'pour', 'avec', 'sans', 'dans', 'sur', 'très', 'tres', 'bon', 'état', 'etat', 'vend', 'vends', 'vente', 'and', 'the']);
function modal(build) {
  const close = () => { ov.remove(); history.replaceState(null, '', location.pathname); };
  const ov = h('div', { class: 'overlay', onclick: (e) => { if (e.target === ov) close(); } },
    h('div', { class: 'modal card', role: 'dialog', 'aria-modal': 'true' }, h('button', { type: 'button', class: 'btn small ghost close', 'aria-label': 'Fermer', text: "×", onclick: () => close() }), ...build(close)));
  document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
  document.body.append(ov);
}
async function openFromHash() {
  const m = location.hash.match(/^#(avis|vendeur)\/([^/]+)\/([^/]+)$/);
  if (!m) return;
  const [, kind, search, id] = m.map(decodeURIComponent);
  let info;
  try { info = await api(`/api/listing?search=${encodeURIComponent(search)}&id=${encodeURIComponent(id)}`); }
  catch (e) { showMsg('err', `Annonce introuvable : ${e.message}`); return; }
  const head = h('div', { class: 'modal-head' }, h('a', { href: info.url, target: '_blank', rel: 'noopener noreferrer', text: info.title }), h('span', { text: info.price != null ? ` · ${info.price} €` : '' }));
  if (kind === 'vendeur') {
    const msg = info.question || `Bonjour, votre annonce « ${info.title} »${info.price != null ? ` à ${info.price} €` : ''} est-elle toujours disponible ? Je suis intéressé. Serait-il possible de la voir en main propre avant l’achat ? Merci !`;
    const ta = h('textarea', { rows: 5 }, msg);
    return modal((close) => [h('h2', { text: 'Écrire au vendeur' }), head,
      h('p', { class: 'help', text: 'Message prêt à copier : Leboncoin demande d’envoyer les messages depuis son site.' }), ta,
      h('div', { class: 'row', style: 'margin-top:12px;justify-content:flex-end' },
        h('a', { class: 'btn', href: info.url, target: '_blank', rel: 'noopener noreferrer', text: 'Ouvrir l’annonce ↗', style: 'flex:0 0 auto;display:inline-flex;align-items:center;text-decoration:none;min-width:0' }),
        h('button', { type: 'button', class: 'btn primary', style: 'flex:0 0 auto;min-width:0', text: 'Copier le message', onclick: async (e) => { try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); } e.target.textContent = 'Copié ✓'; } }))]);
  }
  const alert = searches().find((x) => x.name === search);
  if (!alert) { showMsg('err', `L’alerte « ${search} » n’existe plus.`); return; }
  const excl = new Set(alert.keywords_exclude || []);
  const words = [...new Set((info.title || '').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter((w) => w.length >= 3 && !STOP.has(w) && !excl.has(w)))];
  const picked = new Set();
  let lowerMax = false;
  const chips = h('div', { class: 'pills' }, ...words.map((w) => { const b = h('button', { type: 'button', class: 'pill', 'aria-pressed': 'false', text: w, onclick: () => { picked.has(w) ? picked.delete(w) : picked.add(w); b.setAttribute('aria-pressed', String(picked.has(w))); } }); return b; }));
  const newMax = info.price != null ? Math.max(1, info.price - 1) : null;
  return modal((close) => [h('h2', { text: 'Pas intéressé : affiner l’alerte' }), head,
    h('p', { class: 'help', text: `Alerte « ${search} ». Choisis ce qui ne te plaît pas pour ne plus recevoir ce genre d’annonce.` }),
    words.length ? field('Ignorer à l’avenir les titres contenant', chips) : null,
    newMax != null && (alert.max_price == null || alert.max_price > newMax) ? h('div', { class: 'field' }, h('label', { class: 'switch' }, h('input', { type: 'checkbox', onchange: (e) => { lowerMax = e.target.checked; } }), h('span', { text: `Trop cher : baisser mon prix max à ${newMax} €` }))) : null,
    h('div', { class: 'row', style: 'margin-top:12px;justify-content:flex-end' },
      h('button', { type: 'button', class: 'btn', style: 'flex:0 0 auto;min-width:0', text: 'Ne rien changer', onclick: close }),
      h('button', { type: 'button', class: 'btn primary', style: 'flex:0 0 auto;min-width:0', text: 'Appliquer et enregistrer', onclick: async () => {
        if (!picked.size && !lowerMax) return close();
        if (picked.size) alert.keywords_exclude = [...excl, ...picked];
        if (lowerMax) alert.max_price = newMax;
        touch(); S.view = 'search'; S.sel = searches().indexOf(alert); render();
        if (await save()) close();
      } }))]);
}
window.addEventListener('hashchange', openFromHash);

$('saveBtn').addEventListener('click', save);
$('addBtn').addEventListener('click', addSearch);
$('settingsBtn').addEventListener('click', () => { S.view = 'settings'; render(); });
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (S.dirty) save(); } });

(async () => {
  try {
    const d = await api('/api/config');
    S.cfg = d.config;
    for (const s of S.cfg.search || []) if (s.seller_type === 'private') s.seller_type = 'particulier';
    S.secrets = d.secrets; S.version = d.version;
    render(); renderStatus(); preview(); openFromHash();
  } catch (e) { showMsg('err', `Impossible de lire la configuration : ${e.message}`); renderStatus('', 'Erreur'); }
})();
</script>
</body>
</html>
