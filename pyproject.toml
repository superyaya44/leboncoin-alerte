[project]
name = "leboncoin-alerte"
version = "0.1.0"
description = "Alertes Leboncoin via navigateur humain-like + notifications webhook (Discord, email, Telegram, générique)."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.scripts]
lbc-alerte = "leboncoin_alerte.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leboncoin_alerte"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
